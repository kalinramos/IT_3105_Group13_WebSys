  <body>

    <form>
      <label for = "colors">Colors:</label>
      <select id = "colors">
        <option value = "pink">Pink</option>
        <option value ="peach">Peach</option>
        <option value = "periwinkle">Periwinkle</option>

      </select>
    </form>
    <br>
    <form>
      <label for = "phone">Phone Number:</label>
      <input type = "tel" id = "phone" pattern = "[0-9]{4}-[0-9]{3}-[0-9]{4}">
      <br><br>
      <button type = "submit">Submit</button>
      <br><br>
      <button type = "resetButton">Reset</button>
      <br><br>
      <button type = "button">Define me</button>
    </form>

    <!--DATALISTS-->
    <label for="pk-choice">Choose a Pokemon:</label>

      <option value = "Pikachu">
      <option value = "Jigglypuff">
      <option value = "Squirtle">
      <option value ="Psyduck">
    </datalist>

</html>
